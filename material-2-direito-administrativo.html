    <div class="set"><span>Progresso salvo<small>Fica só neste navegador</small></span><button class="btn ghost" id="resetAll2">Apagar tudo</button></div></div>`;
  $("#sheet").classList.add("open"); $("#closeSet").focus();
}
function closeSettings(){ $("#sheet").classList.remove("open"); $("#setBtn").focus(); }
function resetAll(){ if (!confirm("Apagar todo o progresso, pontos e tempo deste módulo neste navegador?")) return;
  const keep = S.prefs; S = def(); S.prefs = keep; save(); pauseStartAt = null; V.name = "welcome"; P = { mode:"off", end:0 }; paintPomo(); closeSettings(); render(); toast("Tudo apagado. Digite o nome para recomeçar."); }

/* ---------- render ---------- */
function render(){
  document.body.classList.toggle("gate", !S.name);
  if (!S.name) V.name = "welcome";
  renderSide(); paintTop(); paintPause();
  const vw = $("#view");
  vw.innerHTML = V.name === "welcome" ? vWelcome() : V.name === "home" ? vHome() : V.name === "mission" ? vMission() : V.name === "errors" ? vErrors() : V.name === "edital" ? vEdital() : vResult();
  setTimeout(drawProfessorQrs, 0);
  $("#focusBtn").setAttribute("aria-pressed", document.body.classList.contains("focus"));
  if (V.name === "welcome"){ const f = $("#nameForm"); f.onsubmit = ev => { ev.preventDefault(); const n = $("#nameIn").value.trim(); if (!n) return;
    S.name = n; startClock(); save(); toast(`Bem-vinda, ${esc(n)}! O tempo começou a contar.`); nextTarget().fn(); }; setTimeout(() => $("#nameIn").focus(), 50); }
}

/* ---------- ações ---------- */
function answer(i, el){
  const m = byId(V.mid), q = m.quiz[V.qi]; if (!q || S.ans[q.id]) return;
  startClock();
  const c = i === q.a; S.ans[q.id] = { pick: i, c, t: Date.now() };
  S.streak = c ? S.streak + 1 : 0; S.best = Math.max(S.best, S.streak);
  seen(m.id, "quiz");
  if (m.id === "sim" && mStats(m).a === m.quiz.length) S.done.sim = "ok";
  touch(); save();
  render();
  const btn = $(`[data-opt="${i}"]`);
  if (c && btn) floaty(btn, "+" + PTS);
  if (S.streak === 5 || S.streak === 10) toast(`${S.streak} acertos seguidos. Continue assim!`);
  if (!S.finishedAt && totals().a === TOTAL_Q){ S.finishedAt = Date.now(); S.paused = false; save(); setTimeout(() => go("result"), 2500);
    toast("Você respondeu todas as questões do módulo.", [["Ver relatório", () => go("result")]], 15000); }
  const n = $("#qNext"); if (n) n.focus({ preventScroll: true });
}
document.addEventListener("click", e => {
  const b = e.target.closest("button, input"); if (!b) return;
  if (b.matches("#homeBtn")) return go("home");
  if (b.matches("#goNext")) return nextTarget().fn();
  if (b.dataset.go) return go(b.dataset.go, b.dataset.go === "errors" ? { practiceIds: null } : {});
  if (b.dataset.mid && b.closest("#view")){ const m = byId(b.dataset.mid); return go("mission", { mid: m.id, step: nextStepFor(m), qi: firstOpenQ(m), fi: 0, flipped: false, openSec: firstUnread(m) }); }
  if (b.dataset.step){ V.step = b.dataset.step; if (V.step === "flash"){ V.fi = 0; V.flipped = false; V.deck = null; } if (V.step === "quiz"){ V.qi = firstOpenQ(byId(V.mid)); }
    if (V.step === "entenda") V.openSec = firstUnread(byId(V.mid));
    seen(V.mid, V.step); render(); window.scrollTo({ top: 0 }); return; }
  if (b.dataset.acc != null){ const i = +b.dataset.acc; V.openSec = V.openSec === i ? -1 : i; render();
    const el = $(`[data-acc="${i}"]`); if (el) el.scrollIntoView({ block: "start", behavior: S.prefs.motion === "off" ? "auto" : "smooth" }); return; }
  if (b.dataset.read != null){ const i = +b.dataset.read, m = byId(V.mid); S.read[m.id] = S.read[m.id] || []; if (!S.read[m.id].includes(i)) S.read[m.id].push(i); touch();
    const nxt = m.sections.findIndex((_,k) => !S.read[m.id].includes(k)); V.openSec = nxt; render();
    if (nxt >= 0){ const el = $(`[data-acc="${nxt}"]`); if (el) el.scrollIntoView({ block: "start", behavior: S.prefs.motion === "off" ? "auto" : "smooth" }); }
    else toast("Todos os blocos lidos. Agora, as pegadinhas.", [["Ir", () => { V.step = "pegadinhas"; seen(V.mid, "pegadinhas"); render(); window.scrollTo({ top: 0 }); }]]);
    return; }
  if (b.id === "card"){ V.flipped = !V.flipped; $("#card").classList.toggle("flipped", V.flipped); $$("[data-fc]").forEach(x => x.disabled = !V.flipped);
    $("#card").setAttribute("aria-label", V.flipped ? "Resposta mostrada" : "Pergunta"); return; }
  if (b.dataset.fc){ const m = byId(V.mid), idx = V.deck[V.fi]; S.flash[m.id+":"+idx] = b.dataset.fc; touch(); startClock();
    V.fi++; V.flipped = false;
    if (V.fi >= V.deck.length){ V.deck = null; const k = m.flash.filter((_,i) => S.flash[m.id+":"+i] === "sei").length;
      toast(k === m.flash.length ? "Baralho dominado! Hora das questões." : `Rodada completa: ${k} de ${m.flash.length} sabidos. Os que faltam voltam primeiro.`,
        k === m.flash.length ? [["Ir às questões", () => { V.step = "quiz"; V.qi = firstOpenQ(m); seen(m.id,"quiz"); render(); window.scrollTo({top:0}); }]] : []); }
    render(); return; }
  if (b.dataset.qi != null){ V.qi = +b.dataset.qi; render(); return; }
  if (b.dataset.opt != null) return answer(+b.dataset.opt, b);
  if (b.id === "qNext"){ const m = byId(V.mid); const open = m.quiz.findIndex((q,k) => k > V.qi && !S.ans[q.id]);
    V.qi = open >= 0 ? open : (m.quiz.findIndex(q => !S.ans[q.id]) >= 0 ? m.quiz.findIndex(q => !S.ans[q.id]) : m.quiz.length); render(); window.scrollTo({ top: 0 }); return; }
  if (b.dataset.conf){ S.done[V.mid] = b.dataset.conf; touch(); save(); render(); return; }
  if (b.id === "toNext"){ const m = byId(V.mid), n = ALL[ALL.indexOf(m) + 1]; return go("mission", { mid: n.id, step: nextStepFor(n), qi: firstOpenQ(n), fi: 0, flipped: false, openSec: firstUnread(n) }); }
  if (b.id === "doPractice"){ V.practiceIds = wrongIds(); V.pi = 0; V.ppick = null; render(); return; }
  if (b.dataset.popt != null){ const id = V.practiceIds[V.pi], q = QMAP[id]; V.ppick = +b.dataset.popt; if (V.ppick === q.a) S.practice[id] = true; touch(); render(); return; }
  if (b.id === "pNext"){ V.pi++; V.ppick = null; render(); window.scrollTo({ top: 0 }); return; }
  if (b.id === "endPractice"){ V.practiceIds = null; render(); return; }
  if (b.dataset.ed){ S.edital[b.dataset.ed] = b.checked; touch(); return; }
  if (b.id === "copyRes"){ const t = totals(); const txt = `UFBA 2026 — Direito Administrativo: ${t.c * PTS}/${t.t * PTS} pts (${t.c}/${t.t} acertos), tempo ativo ${clock(S.active)}.`;
    const ok = () => toast("Resumo copiado."), fail = () => toast(txt, [], 12000);
    try { navigator.clipboard.writeText(txt).then(ok, fail); } catch (err) { fail(); } return; }
  if (b.id === "resetAll" || b.id === "resetAll2" || b.id === "resetPause") return resetAll();
  if (b.id === "pauseBtn") return setPause(!S.paused);
  if (b.id === "resumeBtn") return setPause(false);
  if (b.id === "copyRep"){ const txt = reportText(); const fail = () => toast("Não deu para copiar aqui. Use o print da tela.", [], 6000);
    try { navigator.clipboard.writeText(txt).then(() => toast("Relatório copiado. Cole no WhatsApp do seu pai."), fail); } catch (err) { fail(); } return; }
  if (b.dataset.copyPqr){
    const raw = decodeURIComponent(b.dataset.copyPqr);
    const fail = () => { try { prompt("Copie o conteúdo abaixo para leitura manual no Painel do Professor:", raw); } catch (err) {} };
    try { navigator.clipboard.writeText(raw).then(() => toast("Conteúdo do QR copiado."), fail); } catch (err) { fail(); }
    return;
  }
  if (b.id === "menuBtn"){ document.body.classList.add("drawer"); const f = $("#side button"); if (f) f.focus(); return; }
  if (b.id === "focusBtn"){ document.body.classList.toggle("focus"); b.setAttribute("aria-pressed", document.body.classList.contains("focus")); return; }
  if (b.id === "setBtn") return openSettings();
  if (b.id === "closeSet") return closeSettings();
  if (b.id === "pomoBtn"){ if (P.mode === "off"){ pomoStart("focus"); startClock(); toast(`Bloco de ${S.prefs.pomo} minutos começou. Só esta missão agora.`); } else { P = { mode:"off", end:0 }; paintPomo(); } return; }
  if (b.dataset.pref){ let v = b.dataset.val; if (b.dataset.pref === "size" || b.dataset.pref === "pomo") v = +v; S.prefs[b.dataset.pref] = v; touch(); save(); applyPrefs(); paintPomo(); openSettings(); return; }
  if (b.dataset.tog){ S.prefs[b.dataset.tog] = !S.prefs[b.dataset.tog]; touch(); save(); applyPrefs(); openSettings(); return; }
});
$("#scrim").onclick = () => document.body.classList.remove("drawer");
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSettings(); });

/* ---------- teclado ---------- */
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if ((k === " " || k === "Enter") && e.target.closest && e.target.closest("button")) return;
  if (k === "Escape"){ if ($("#sheet").classList.contains("open")) closeSettings(); document.body.classList.remove("drawer"); return; }
  if ($("#sheet").classList.contains("open") || S.paused || !S.name) return;
  if (k === "f" || k === "F"){ $("#focusBtn").click(); return; }
  if (V.name === "mission" && V.step === "quiz"){
    const m = byId(V.mid), q = m.quiz[V.qi];
    let i = "abcde".indexOf(k.toLowerCase()); if (i < 0) i = "12345".indexOf(k);
    if (q && i >= 0 && !S.ans[q.id]){ e.preventDefault(); answer(i); return; }
    if ((k === "Enter" || k === "ArrowRight") && $("#qNext")){ e.preventDefault(); $("#qNext").click(); return; }
  }
  if (V.name === "mission" && V.step === "flash"){
    if (k === " "){ e.preventDefault(); $("#card").click(); return; }
    if (V.flipped && (k === "1" || k === "2")){ $(`[data-fc="${k === "1" ? "sei" : "rever"}"]`).click(); return; }
  }
  if (V.name === "errors" && V.practiceIds && V.ppick == null){ let i = "abcde".indexOf(k.toLowerCase()); if (i < 0) i = "12345".indexOf(k);
    if (i >= 0){ const b = $(`[data-popt="${i}"]`); if (b) b.click(); } }
  else if (V.name === "errors" && V.practiceIds && k === "Enter" && $("#pNext")) $("#pNext").click();
});

/* ---------- régua de leitura ---------- */
window.addEventListener("pointermove", e => { if (S.prefs.ruler) $("#ruler").style.top = e.clientY + "px"; }, { passive: true });

document.addEventListener("visibilitychange", () => {
  const active = S.started && !S.finishedAt && !S.paused;
  if (document.visibilityState === "hidden"){ if (active){ S.leaves++; touch(); } save(); }
  else if (active) toast("Você saiu da aba. Deixe esta aba aberta até terminar; para parar, use ⏸ Pausar.", [], 7000);
});
window.addEventListener("beforeunload", e => { save(); if (S.started && !S.finishedAt && !S.paused){ e.preventDefault(); e.returnValue = ""; } });
applyPrefs(); paintPomo(); render();
})();

</script>
</body>
</html>
