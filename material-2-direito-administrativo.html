<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Direito Administrativo — UFBA 2026, Assistente em Administração</title>
<meta name="description" content="Módulo interativo de Direito Administrativo para o concurso UFBA 2026 (Edital nº 7/2026), cargo 201 — Assistente em Administração.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf0ef; --surface:#ffffff; --sunk:#f3f6f6; --ink:#15212b; --muted:#56636f; --line:#d3dddd;
  --accent:#0d6687; --accent-ink:#ffffff; --accent-soft:#dcedf3;
  --reward:#b97800; --reward-soft:#fff1d2;
  --ok:#17744a; --ok-soft:#dff3e8; --bad:#b1261d; --bad-soft:#fbe4e1;
  --trap:#8a5a00; --trap-soft:#fff5dc; --law:#2b4f9a; --law-soft:#e7edfb; --ufba:#1b6b63; --ufba-soft:#dff2ef;
  --c1:#3a66c9; --c2:#0d8577; --c3:#7650bd; --c4:#bd4466; --c5:#b57400; --c6:#2f7a34; --c7:#1b5c9e; --csim:#15212b;
  --mark:#fff0a8;
  --font:"Lexend", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs:17px; --lh:1.65; --ls:0;
  --r-s:8px; --r-m:14px; --r-l:22px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e161c; --surface:#16212a; --sunk:#111b22; --ink:#e3ebef; --muted:#9dafba; --line:#27363f;
    --accent:#5cb8d8; --accent-ink:#06202b; --accent-soft:#16384a;
    --reward:#f0b53d; --reward-soft:#3a2d10;
    --ok:#5fcf93; --ok-soft:#133226; --bad:#ff8a7e; --bad-soft:#3b1a17;
    --trap:#f2c15a; --trap-soft:#2f2612; --law:#9db8ff; --law-soft:#1b2640; --ufba:#6fd3c4; --ufba-soft:#12302c;
    --c1:#7da0f0; --c2:#4cc6b6; --c3:#b494ee; --c4:#ee86a3; --c5:#f0b53d; --c6:#79c67d; --c7:#6aa9ec; --csim:#e3ebef;
    --mark:#5a4b10; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#16212a; --sunk:#111b22; --ink:#e3ebef; --muted:#9dafba; --line:#27363f;
  --accent:#5cb8d8; --accent-ink:#06202b; --accent-soft:#16384a;
  --reward:#f0b53d; --reward-soft:#3a2d10;
  --ok:#5fcf93; --ok-soft:#133226; --bad:#ff8a7e; --bad-soft:#3b1a17;
  --trap:#f2c15a; --trap-soft:#2f2612; --law:#9db8ff; --law-soft:#1b2640; --ufba:#6fd3c4; --ufba-soft:#12302c;
  --c1:#7da0f0; --c2:#4cc6b6; --c3:#b494ee; --c4:#ee86a3; --c5:#f0b53d; --c6:#79c67d; --c7:#6aa9ec; --csim:#e3ebef;
  --mark:#5a4b10; color-scheme:dark;
}
:root[data-font="atkinson"]{--font:"Atkinson Hyperlegible", system-ui, sans-serif}
:root[data-font="system"]{--font:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
:root[data-size="0"]{--fs:15.5px} :root[data-size="2"]{--fs:19px} :root[data-size="3"]{--fs:21px}
:root[data-spacing="wide"]{--lh:1.9; --ls:.02em}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px); -webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:var(--fs); line-height:var(--lh); letter-spacing:var(--ls); overflow-x:hidden}
button,input,select{font:inherit; color:inherit; letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}
img,svg{max-width:100%}
mark{background:var(--mark); color:inherit; padding:0 .15em; border-radius:3px}
.sr{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- top bar ---------- */
.top{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px); margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.top-in{max-width:1240px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:10px}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0; background:none; border:0; padding:4px; text-align:left}
.brand-mark{width:34px; height:34px; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:.95rem; flex:none}
.brand-txt{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.brand-txt b{font-size:.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand-txt small{color:var(--muted); font-size:.78rem}
.pill{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:.86rem; font-variant-numeric:tabular-nums; white-space:nowrap}
.pill.pts{border-color:color-mix(in srgb, var(--reward) 45%, var(--line)); background:var(--reward-soft); font-weight:600}
.pill.paused{color:var(--muted); border-style:dashed}
.icon-btn{border:1px solid var(--line); background:var(--surface); border-radius:12px; min-width:40px; height:40px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:.86rem}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.pomo.run{background:var(--accent-soft); border-color:var(--accent); font-variant-numeric:tabular-nums; font-weight:600}
.pomo.brk{background:var(--ok-soft); border-color:var(--ok)}
.only-narrow{display:none}

/* ---------- layout ---------- */
.shell{max-width:1240px; margin:0 auto; padding:22px 18px 80px; display:grid; grid-template-columns:290px minmax(0,1fr); gap:28px; align-items:start}
.side{position:sticky; top:84px; max-height:calc(100vh - 100px); overflow:auto; padding-right:4px}
main{min-width:0; max-width:780px}
main:focus{outline:none}
body.focus .side,body.focus .hide-focus{display:none!important}
body.focus .shell{grid-template-columns:minmax(0,1fr); justify-items:center}
body.focus main{max-width:720px; width:100%}

/* ---------- trilha (linha de metrô) ---------- */
.line-title{font-size:.82rem; color:var(--muted); margin:0 0 8px 6px}
.stations{list-style:none; margin:0; padding:0; position:relative}
.stations::before{content:""; position:absolute; left:22px; top:18px; bottom:18px; width:4px; border-radius:4px; background:var(--line)}
.st{position:relative}
.st button{width:100%; display:grid; grid-template-columns:48px 1fr; align-items:center; gap:4px; background:none; border:0; text-align:left; padding:7px 6px 7px 0; border-radius:12px}
.st button:hover{background:var(--sunk)}
.st.cur button{background:var(--surface); box-shadow:0 0 0 1px var(--line)}
.dot{justify-self:center; width:26px; height:26px; border-radius:50%; background:var(--surface); border:4px solid var(--mc,var(--muted)); display:grid; place-items:center; font-size:.72rem; font-weight:700; position:relative; z-index:1; color:var(--mc)}
.st.done .dot{background:var(--mc); color:var(--surface)}
.st.cur .dot{box-shadow:0 0 0 5px color-mix(in srgb, var(--mc) 25%, transparent)}
.st-name{font-size:.9rem; font-weight:600; line-height:1.25}
.st-meta{font-size:.76rem; color:var(--muted); display:block; font-weight:400; margin-top:2px}
.side-links{margin-top:14px; display:grid; gap:6px}
.side-links button{display:flex; justify-content:space-between; align-items:center; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 12px; font-size:.88rem; text-align:left}
.side-links button:hover{border-color:var(--accent)}
.count{background:var(--bad-soft); color:var(--bad); border-radius:999px; padding:0 8px; font-size:.78rem; font-weight:700}

/* ---------- generic blocks ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:24px}
.panel + .panel{margin-top:16px}
h1,h2,h3{line-height:1.2; letter-spacing:-.01em; margin:0 0 .5em}
h1{font-size:clamp(1.7rem,4.2vw,2.5rem); font-weight:700}
h2{font-size:clamp(1.25rem,2.6vw,1.6rem); font-weight:700}
h3{font-size:1.1rem; font-weight:600}
p{margin:0 0 .9em} .muted{color:var(--muted)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent; border-radius:14px; padding:12px 18px; font-weight:600; min-height:46px}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface); border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.big{font-size:1.05rem; padding:15px 24px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.tag{display:inline-block; font-size:.78rem; border-radius:999px; padding:3px 10px; background:var(--sunk); border:1px solid var(--line); color:var(--muted)}
.tag.two{background:var(--ufba-soft); color:var(--ufba); border-color:transparent; font-weight:600; border-radius:10px; line-height:1.4; padding:6px 10px}
.hint{font-size:.92em; color:var(--muted); border-left:3px solid var(--line); padding-left:12px}

/* content blocks */
.tbl{overflow-x:auto; margin:0 0 1em; border:1px solid var(--line); border-radius:var(--r-m)}
.tbl table{border-collapse:collapse; width:100%; font-size:.92em; min-width:460px}
.tbl th,.tbl td{padding:10px 12px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line)}
.tbl th{background:var(--sunk); font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.card-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin:0 0 1em}
.mini{background:var(--sunk); border-radius:var(--r-m); padding:14px 16px}
.mini b{display:block; margin-bottom:4px}
.mini p{margin:0; font-size:.94em}
aside.law,aside.trap,aside.ufba{border-radius:var(--r-m); padding:13px 16px; margin:0 0 1em; font-size:.95em}
aside.law{background:var(--law-soft); border-left:5px solid var(--law)}
aside.trap{background:var(--trap-soft); border-left:5px solid var(--trap)}
aside.ufba{background:var(--ufba-soft); border-left:5px solid var(--ufba)}
ul.clean{padding-left:1.2em; margin:0 0 1em} ul.clean li{margin:.3em 0}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 1em}
.chips span{background:var(--sunk); border:1px solid var(--line); border-radius:999px; padding:3px 11px; font-size:.86em}
ol.phases{counter-reset:ph; list-style:none; padding:0; margin:0 0 1em; display:flex; flex-wrap:wrap; gap:6px}
ol.phases li{counter-increment:ph; background:var(--sunk); border:1px solid var(--line); border-radius:12px; padding:6px 12px 6px 8px; font-size:.9em}
ol.phases li::before{content:counter(ph); display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--c7); color:var(--surface); font-size:.75rem; font-weight:700; margin-right:6px}

/* ---------- home ---------- */
.hero-count{font-size:clamp(2.6rem,9vw,4.6rem); font-weight:700; line-height:1; letter-spacing:-.03em; margin:0 0 .15em}
.hero-count span{color:var(--accent)}
.weights{display:flex; height:40px; border-radius:12px; overflow:hidden; margin:14px 0 8px; border:1px solid var(--line)}
.weights div{display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; padding:0 4px}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.84rem; color:var(--muted)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:middle}
.how{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; margin-top:6px}
.how div{background:var(--sunk); border-radius:var(--r-m); padding:14px}
.how b{display:block}
.mobile-line{display:none}

/* ---------- mission ---------- */
.m-head{border-top:6px solid var(--mc); }
.m-kicker{font-size:.86rem; color:var(--mc); font-weight:600; margin-bottom:6px}
.steps{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 6px; margin:16px 0 0; scrollbar-width:thin}
.steps button{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-size:.88rem; display:inline-flex; gap:7px; align-items:center}
.steps button .n{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--sunk); font-size:.75rem; font-weight:700}
.steps button.seen .n{background:var(--mc); color:var(--surface)}
.steps button[aria-current="step"]{border-color:var(--mc); box-shadow:inset 0 0 0 1px var(--mc); font-weight:600}
.sum-grid{display:grid; gap:10px}
.sum{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start; background:var(--sunk); border-radius:var(--r-m); padding:14px 16px}
.sum .k{font-weight:700; color:var(--mc); min-width:8.5em}
.sum p{margin:0}
.acc{border:1px solid var(--line); border-radius:var(--r-m); margin-bottom:10px; background:var(--surface); overflow:hidden}
.acc > button{width:100%; display:flex; gap:12px; align-items:center; background:none; border:0; padding:14px 16px; text-align:left; font-weight:600}
.acc > button .chk{width:24px; height:24px; border-radius:50%; border:2px solid var(--line); flex:none; display:grid; place-items:center; font-size:.8rem}
.acc.read > button .chk{background:var(--mc); border-color:var(--mc); color:var(--surface)}
.acc > button .mins{margin-left:auto; font-weight:400; color:var(--muted); font-size:.8rem}
.acc-body{padding:4px 18px 16px}
.acc.open{border-color:var(--mc)}
.trap-list{list-style:none; padding:0; margin:0 0 1.2em; display:grid; gap:8px}
.trap-list li{background:var(--trap-soft); border-radius:var(--r-m); padding:12px 14px 12px 44px; position:relative}
.trap-list li::before{content:"!"; position:absolute; left:14px; top:12px; width:20px; height:20px; border-radius:50%; background:var(--trap); color:var(--surface); display:grid; place-items:center; font-weight:700; font-size:.8rem}
.mn{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px}
.mn div{border:2px dashed color-mix(in srgb, var(--mc) 55%, var(--line)); border-radius:var(--r-m); padding:14px}
.mn b{display:block; font-size:1.02rem; color:var(--mc)}
.next-row{margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between; align-items:center}

/* flashcards */
.flash-wrap{perspective:1200px}
.flash{width:100%; min-height:220px; border:0; background:none; padding:0; position:relative; transform-style:preserve-3d; transition:transform .45s ease}
.flash.flipped{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--r-l); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:26px; font-size:1.12em}
.face.front{background:var(--sunk); border:2px solid var(--line)}
.face.back{background:var(--surface); border:2px solid var(--mc); transform:rotateY(180deg)}
.face small{position:absolute; bottom:12px; font-size:.75rem; color:var(--muted)}
.fc-meta{display:flex; justify-content:space-between; font-size:.86rem; color:var(--muted); margin:10px 2px}

/* quiz */
.qdots{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
.qdots button{width:30px; height:30px; border-radius:9px; border:1px solid var(--line); background:var(--surface); font-size:.78rem; font-weight:600}
.qdots button.ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.qdots button.no{background:var(--bad-soft); border-color:var(--bad); color:var(--bad)}
.qdots button.now{box-shadow:0 0 0 2px var(--mc)}
.qtext{font-size:1.08em; font-weight:500; margin-bottom:14px}
.opts{display:grid; gap:9px}
.opt{display:grid; grid-template-columns:38px 1fr; gap:10px; align-items:start; text-align:left; border:1.5px solid var(--line); background:var(--surface); border-radius:var(--r-m); padding:11px 14px 11px 10px; min-height:52px}
.opt:hover:not([disabled]){border-color:var(--mc); background:var(--sunk)}
.opt .L{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:var(--sunk); font-weight:700; font-size:.9rem}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok); background:var(--ok-soft)} .opt.right .L{background:var(--ok); color:var(--surface)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)} .opt.wrong .L{background:var(--bad); color:var(--surface)}
.opt.dim{opacity:.6}
.fb{margin-top:14px; border-radius:var(--r-m); padding:14px 16px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb b{display:block; margin-bottom:4px}
.floaty{position:fixed; pointer-events:none; font-weight:700; color:var(--reward); font-size:1.3rem; z-index:90; animation:up .9s ease-out forwards}
@keyframes up{from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-46px)}}
.kbd-hint{font-size:.8rem; color:var(--muted); margin-top:12px}
kbd{font-family:inherit; font-size:.8em; background:var(--sunk); border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:0 6px}
.conf{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0}
.conf button{border:1.5px solid var(--line); background:var(--surface); border-radius:var(--r-m); padding:12px 8px; font-size:.9rem}
.conf button[aria-pressed="true"]{border-color:var(--mc); background:var(--sunk); font-weight:600}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:12px 0}
.stat{background:var(--sunk); border-radius:var(--r-m); padding:14px}
.stat b{display:block; font-size:1.5rem; line-height:1.1; font-variant-numeric:tabular-nums}
.stat span{display:block; margin-top:4px; font-size:.82rem; line-height:1.35; color:var(--muted)}

/* results */
.score-big{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.score-big b{font-size:clamp(3rem,11vw,5.5rem); line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums}
.score-big span{font-size:1.2rem; color:var(--muted)}
.gauge{position:relative; height:18px; border-radius:999px; background:var(--sunk); border:1px solid var(--line); margin:22px 0 34px}
.gauge .fill{position:absolute; inset:0 auto 0 0; border-radius:999px; background:var(--accent)}
.gauge .mk{position:absolute; top:-6px; bottom:-6px; width:2px; background:var(--ink)}
.gauge .mk span{position:absolute; top:26px; transform:translateX(-50%); font-size:.72rem; white-space:nowrap; color:var(--muted)}
.bars{display:grid; gap:10px}
.bar-row{display:grid; grid-template-columns:minmax(120px,1.3fr) 2fr auto; gap:12px; align-items:center; font-size:.9rem}
.bar{height:12px; background:var(--sunk); border-radius:999px; overflow:hidden}
.bar i{display:block; height:100%; border-radius:999px}
.verdict{border-radius:var(--r-m); padding:16px; margin:14px 0; background:var(--sunk); border-left:6px solid var(--accent)}

/* edital */
.ed-area{margin-bottom:18px}
.ed-area h3{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.ed-area h3 small{font-weight:400; color:var(--muted); font-size:.82rem}
.ed-item{display:flex; gap:12px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:12px; margin-bottom:6px; background:var(--surface)}
.ed-item input{width:20px; height:20px; margin-top:3px; accent-color:var(--accent); flex:none}
.ed-item small{display:block; color:var(--muted); font-size:.82rem}

/* settings / toast / ruler */
.sheet{position:fixed; inset:0; z-index:80; display:none; background:rgba(8,14,18,.45); padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px)); overflow:auto}
.sheet.open{display:grid; place-items:start center}
.sheet .panel{width:min(560px,100%); margin-top:40px}
.set{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line)}
.set:last-of-type{border-bottom:0}
.set small{display:block; color:var(--muted); font-size:.82rem}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:12px; overflow:hidden}

<script>
/* ===== Helpers de conteúdo ===== */
function tbl(head, rows){
  return `<div class="tbl" tabindex="0"><table><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
/* ===== Missões 1–3 ===== */
const MISSIONS = [];

MISSIONS.push({
  id: "m1", n: 1, color: "var(--c1)", min: 25,
  title: "Estado, Governo e Administração Pública",
  edital: "Item 1: conceitos, elementos, poderes, organização, natureza, fins e princípios.",
  twoInOne: "Também cai em Administração Pública (Conhecimentos Comuns, item 1): princípios do art. 37.",
  summary: [
    ["Estado", "Pessoa jurídica de direito público. Elementos clássicos: <mark>povo, território e governo soberano</mark>."],
    ["Governo × Administração", "Governo <b>decide o rumo</b> (função política). Administração <b>executa</b> (função técnica, subordinada à lei)."],
    ["Natureza e fins", "A Administração é um <mark>múnus público</mark>: encargo de cuidar do que é de todos. Fim único: o <b>bem comum</b>."],
    ["Princípios", "Expressos no art. 37: <mark>LIMPE</mark>. Por trás de todos: supremacia e indisponibilidade do interesse público."]
  ],
  sections: [
    { t: "Estado: elementos, poderes e organização", h: `
      <p>O Estado é a <b>pessoa jurídica de direito público</b> que organiza a vida coletiva num território. A doutrina clássica aponta três elementos: <mark>povo</mark> (componente humano), <mark>território</mark> (base física) e <mark>governo soberano</mark> (poder que não se subordina a nenhum outro na ordem interna).</p>
      <p><b>Poderes do Estado</b> (art. 2º da CF): Legislativo, Executivo e Judiciário, <i>independentes e harmônicos entre si</i>. Cada um tem uma função típica, mas também exerce funções atípicas.</p>
      ${tbl(["Poder","Função típica","Exemplo de função atípica"],[
        ["Legislativo","Legislar e fiscalizar","Administrar: realizar licitação para comprar computadores"],
        ["Executivo","Administrar","Legislar: medida provisória; julgar: processo administrativo disciplinar"],
        ["Judiciário","Julgar","Administrar: conceder férias aos seus servidores"]
      ])}
      <p><b>Organização:</b> o Brasil é uma federação. União, Estados, Distrito Federal e Municípios são autônomos (art. 18 da CF): cada um se auto-organiza, se autogoverna e se autoadministra.</p>
      <aside class="trap"><b>Não confunda:</b> <i>poderes do Estado</i> (Legislativo, Executivo, Judiciário) são estruturas da organização política. <i>Poderes administrativos</i> (hierárquico, disciplinar, regulamentar, de polícia) são ferramentas da Administração — assunto da missão 4.</aside>` },
    { t: "Governo × Administração", h: `
      ${tbl(["","Governo","Administração"],[
        ["O que faz","Fixa diretrizes, metas e políticas públicas","Executa essas decisões de forma concreta"],
        ["Natureza da atividade","Política, com ampla discricionariedade","Neutra, técnica, normalmente vinculada à lei"],
        ["Responsabilidade","Constitucional e política","Técnica e legal"],
        ["Exemplo na UFBA","MEC define a política de expansão de vagas","Setor da UFBA organiza a matrícula dos novos alunos"]
      ])}
      <p>Dica de prova: procure o <b>verbo</b>. “Definir, planejar politicamente, escolher prioridades” aponta para Governo. “Executar, prestar, operacionalizar” aponta para Administração.</p>` },
    { t: "Os dois sentidos de “Administração Pública”", h: `
      <div class="card-grid">
        <div class="mini"><b>Sentido subjetivo, formal ou orgânico</b><p><b>Quem</b> administra: pessoas jurídicas, órgãos e agentes públicos. Costuma vir com letra maiúscula: “Administração Pública”.</p></div>
        <div class="mini"><b>Sentido objetivo, material ou funcional</b><p><b>O que</b> se faz: a própria atividade administrativa — <mark>serviço público, polícia administrativa, fomento e intervenção</mark>.</p></div>
      </div>
      <p class="hint">Macete: <b>S</b>ubjetivo = <b>S</b>ujeitos. <b>O</b>bjetivo = <b>O</b>bjeto (a atividade).</p>
      <p>Há ainda o sentido <b>amplo</b> (inclui órgãos de governo e função política) e o <b>estrito</b> (só órgãos e atividades administrativas).</p>` },
    { t: "Natureza e fins", h: `
      <p>Hely Lopes Meirelles ensina que a <b>natureza</b> da Administração é a de um <mark>múnus público</mark> para quem a exerce: um encargo de defesa, conservação e aprimoramento dos bens, serviços e interesses da coletividade. O administrador <b>não é dono</b> do que administra.</p>
      <p>O <b>fim</b> é um só: o <mark>bem comum da coletividade administrada</mark>. Todo ato que se afasta desse fim é ilegítimo, ainda que pareça legal na forma — é aqui que nasce a ideia de <i>desvio de finalidade</i>.</p>` },
    { t: "Princípios: expressos e implícitos", h: `
      ${tbl(["Princípio (art. 37)","Em uma frase","Como a banca cobra"],[
        ["<b>L</b>egalidade","A Administração só faz o que a lei permite ou autoriza","Particular pode tudo o que a lei não proíbe; a Administração, não"],
        ["<b>I</b>mpessoalidade","Atuação voltada ao interesse público, sem favoritismo nem promoção pessoal","Art. 37, §1º: publicidade oficial sem nomes, símbolos ou imagens de autoridades"],
        ["<b>M</b>oralidade","Além de legal, o ato precisa ser ético, leal e de boa-fé","Súmula Vinculante 13 (nepotismo)"],
        ["<b>P</b>ublicidade","Transparência dos atos, como regra","Admite sigilo previsto em lei (segurança da sociedade e do Estado; intimidade)"],
        ["<b>E</b>ficiência","Melhor resultado com bom uso dos recursos","Incluído pela <b>EC nº 19/1998</b> — não estava no texto original"]
      ])}
      <p><b>Supraprincípios:</b> supremacia do interesse público sobre o privado (justifica prerrogativas) e indisponibilidade do interesse público (justifica limites: o gestor não pode abrir mão do que é público).</p>
      <p><b>Implícitos ou legais</b> (a Lei 9.784/1999, art. 2º, lista vários): finalidade, motivação, razoabilidade, proporcionalidade, ampla defesa, contraditório, segurança jurídica e interesse público. Também: <mark>autotutela</mark> (Súmula 473 do STF), continuidade do serviço público e presunção de legitimidade.</p>
      <aside class="law"><b>Súmula 473 do STF:</b> a administração pode anular seus próprios atos, quando eivados de vícios que os tornam ilegais, porque deles não se originam direitos; ou revogá-los, por motivo de conveniência ou oportunidade, respeitados os direitos adquiridos, e ressalvada, em todos os casos, a apreciação judicial.</aside>
      <aside class="ufba"><b>Na UFBA:</b> por ser autarquia federal, a universidade obedece a todos esses princípios. Um edital de concurso publicado no DOU e no site da banca é aplicação direta do princípio da publicidade.</aside>` }
  ],
  traps: [
    "“Estado, Governo e Administração são sinônimos.” <b>Errado.</b> Estado é a pessoa jurídica; Governo decide; Administração executa.",
    "“A legalidade administrativa permite fazer tudo que a lei não proíbe.” <b>Errado.</b> Isso é a legalidade para o particular.",
    "“A eficiência consta no texto original de 1988.” <b>Errado.</b> Entrou com a EC nº 19/1998.",
    "“Publicidade é absoluta.” <b>Errado.</b> A própria Constituição admite sigilo em hipóteses legais.",
    "“Administração em sentido objetivo = conjunto de órgãos.” <b>Errado.</b> Órgãos são o sentido subjetivo; o objetivo é a atividade."
  ],
  mnemonics: [
    ["LIMPE", "Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência."],
    ["S de Sujeito", "Sentido Subjetivo = quem. Sentido objetivo = o que (atividade)."],
    ["Múnus = encargo", "Quem administra cuida do que é dos outros. Por isso não pode dispor do interesse público."]
  ],
  flash: [
    ["Quais são os elementos clássicos do Estado?", "Povo, território e governo soberano."],
    ["Governo ou Administração: “definir as metas da política educacional”?", "Governo (função política)."],
    ["O que é o sentido objetivo de Administração Pública?", "A atividade administrativa: serviço público, polícia administrativa, fomento e intervenção."],
    ["Qual é a natureza da Administração, segundo Hely?", "Múnus público: encargo de defesa e conservação dos interesses da coletividade."],
    ["Qual emenda inseriu a eficiência no art. 37?", "EC nº 19/1998."],
    ["O que diz a Súmula 473 do STF?", "A Administração anula atos ilegais e revoga atos inconvenientes, respeitados direitos adquiridos, ressalvada a apreciação judicial."]
  ],
  quiz: [
    { id: "m1q1", q: "Segundo a doutrina clássica, são elementos constitutivos do Estado:",
      o: ["povo, território e governo soberano.", "União, Estados, Distrito Federal e Municípios.", "Poder Legislativo, Poder Executivo e Poder Judiciário.", "legalidade, impessoalidade e moralidade.", "órgãos, entidades e agentes públicos."], a: 0,
      e: "Os elementos são povo, território e governo soberano. As demais alternativas trazem, na ordem: os entes da federação (organização), os Poderes (funções), princípios e o sentido subjetivo da Administração." },
    { id: "m1q2", q: "A Administração Pública em sentido objetivo (material ou funcional) corresponde:",
      o: ["ao conjunto de órgãos e entidades que integram a estrutura do Estado.", "às atividades administrativas, como serviço público, polícia administrativa, fomento e intervenção.", "aos agentes políticos que fixam as diretrizes do governo.", "exclusivamente ao Poder Executivo federal.", "à função legislativa exercida de forma atípica pelo Executivo."], a: 1,
      e: "Sentido objetivo = o que se faz (a atividade). Órgãos, entidades e agentes correspondem ao sentido subjetivo, formal ou orgânico." },
    { id: "m1q3", q: "Para Hely Lopes Meirelles, a natureza e o fim da Administração Pública são, respectivamente:",
      o: ["poder soberano e arrecadação de tributos.", "função política e governabilidade.", "múnus público e bem comum da coletividade administrada.", "direito subjetivo do administrador e eficiência.", "atividade empresarial e lucro social."], a: 2,
      e: "Natureza: múnus público (encargo de quem administra bens alheios). Fim: o bem comum da coletividade. Qualquer finalidade diferente caracteriza desvio." },
    { id: "m1q4", q: "Sobre o princípio da eficiência, é correto afirmar que:",
      o: ["consta no caput do art. 37 desde o texto original da Constituição de 1988.", "foi incluído expressamente no caput do art. 37 pela Emenda Constitucional nº 19/1998.", "aplica-se apenas às empresas estatais que exploram atividade econômica.", "autoriza o agente a agir sem previsão legal quando o resultado for melhor.", "substituiu o princípio da legalidade a partir da reforma administrativa."], a: 1,
      e: "A eficiência entrou no art. 37 com a EC 19/1998 (reforma administrativa). Ela convive com a legalidade — nunca autoriza agir fora da lei." },
    { id: "m1q5", q: "Um setor administrativo percebe que um ato que ele mesmo praticou é ilegal. Nos termos da Súmula 473 do STF, a Administração:",
      o: ["precisa de autorização judicial para desfazer o ato.", "só pode revogar o ato, nunca anulá-lo.", "deve aguardar provocação do interessado para agir.", "pode anular o ato ilegal com base na autotutela, e pode revogar atos válidos por conveniência e oportunidade, respeitados os direitos adquiridos.", "deve encaminhar o caso ao Poder Legislativo, único competente para anular atos administrativos."], a: 3,
      e: "É o princípio da autotutela: a Administração revê seus próprios atos de ofício. Anula o ilegal; revoga o inconveniente; sempre ressalvada a apreciação judicial." },

        ["Características","Parcial, revogável a qualquer tempo, publicada no meio oficial","Temporária, excepcional, por motivos relevantes devidamente justificados"],
        ["Base","Arts. 11 a 14","Art. 15"]
      ])}
      <aside class="law"><b>Lei 9.784/1999, art. 13:</b> não podem ser objeto de delegação: I – a edição de atos de caráter normativo; II – a decisão de recursos administrativos; III – as matérias de competência exclusiva do órgão ou autoridade.</aside>
      <p class="hint">Macete <b>CE-NO-RA</b>: Competência Exclusiva, atos NOrmativos, Recursos Administrativos.</p>` },
    { t: "Poder disciplinar", h: `
      <p>Permite apurar infrações e aplicar penalidades aos <b>servidores</b> e às demais pessoas sujeitas à disciplina administrativa por um <mark>vínculo específico</mark> — por exemplo, empresas contratadas e estudantes de instituição pública.</p>
      <ul class="clean"><li>Há discricionariedade limitada na <b>escolha e gradação</b> da pena, mas apurar a falta é dever.</li><li>A decisão precisa ser <b>motivada</b> e precedida de processo com contraditório e ampla defesa.</li><li>Multa aplicada a um particular comum, sem vínculo especial, é <b>poder de polícia</b>, não disciplinar.</li></ul>` },
    { t: "Poder regulamentar (normativo)", h: `
      ${tbl(["","Decreto regulamentar (executivo)","Decreto autônomo"],[
        ["Base","CF, art. 84, IV","CF, art. 84, VI"],
        ["Função","Detalhar a lei para sua fiel execução","Tratar diretamente de duas matérias"],
        ["Pode inovar?","Não","Sim, só nas hipóteses constitucionais"],
        ["Delegável?","Não","Sim: a Ministros, ao PGR e ao AGU"]
      ])}
      <p>Matérias do decreto autônomo: a) organização e funcionamento da administração federal, <b>sem aumento de despesa nem criação ou extinção de órgãos</b>; b) <mark>extinção de funções ou cargos públicos, quando vagos</mark>.</p>
      <p>Se o Executivo exorbitar do poder regulamentar, o Congresso Nacional pode <b>sustar</b> o ato (art. 49, V).</p>` },
    { t: "Poder de polícia", h: `
      <p>O art. 78 do CTN define: atividade que limita ou disciplina direito, interesse ou liberdade, regulando a prática de ato ou abstenção de fato, em razão de interesse público (segurança, higiene, ordem, costumes, mercado, tranquilidade, propriedade...).</p>
      ${tbl(["","Polícia administrativa","Polícia judiciária"],[
        ["Recai sobre","Bens, direitos e atividades","Pessoas"],
        ["Foco","Ilícito administrativo, em geral preventivo","Ilícito penal, repressivo"],
        ["Quem exerce","Diversos órgãos (Vigilância Sanitária, Procon, fiscalização de obras)","Polícia Civil e Polícia Federal"]
      ])}
      <div class="card-grid">
        <div class="mini"><b>Ciclo de polícia</b><p><mark>Ordem → Consentimento → Fiscalização → Sanção</mark>. Consentimento: licença (vinculada) ou autorização (discricionária).</p></div>
        <div class="mini"><b>Atributos (DAC)</b><p><b>D</b>iscricionariedade (em regra), <b>A</b>utoexecutoriedade (agir sem ordem judicial, em alguns casos), <b>C</b>oercibilidade (impor à força).</p></div>
      </div>
      <aside class="law"><b>STF, Tema 532 (RE 633.782):</b> é constitucional a delegação do poder de polícia, por meio de lei, a pessoas jurídicas de direito privado integrantes da Administração indireta de capital majoritariamente público que prestem exclusivamente serviço público próprio do Estado e em regime não concorrencial — nas fases de <b>consentimento, fiscalização e sanção</b>. A fase de <b>ordem</b> (legislação) não se delega.</aside>
      <p>Na esfera federal, a ação punitiva decorrente do poder de polícia prescreve em <b>5 anos</b> (Lei 9.873/1999).</p>` },
    { t: "Uso e abuso do poder", h: `
      ${tbl(["Forma de abuso","Qual elemento é violado","Exemplo"],[
        ["Excesso de poder","Competência: o agente vai além do que pode","Chefe aplica demissão, pena que só a autoridade superior pode aplicar"],
        ["Desvio de poder (de finalidade)","Finalidade: age dentro da competência, mas para outro fim","Remover servidor para outra cidade como castigo pessoal"],
        ["Omissão","Dever de agir","Deixar de fiscalizar quando a lei exige"]
      ])}
      <p>Todo ato praticado com abuso de poder é inválido e pode ser anulado pela própria Administração ou pelo Judiciário.</p>` }
  ],
  traps: [
    "“O poder disciplinar alcança qualquer particular.” <b>Errado.</b> Só quem tem vínculo especial. Particular comum = poder de polícia.",
    "“Há hierarquia entre a União e suas autarquias.” <b>Errado.</b> Há tutela (vinculação).",
    "“Todo ato de polícia é autoexecutório.” <b>Errado.</b> A cobrança forçada de multa, por exemplo, depende de execução judicial.",
    "“Licença é ato discricionário.” <b>Errado.</b> Licença é vinculada; autorização é discricionária.",
    "“É possível delegar a decisão de recurso administrativo.” <b>Errado.</b> CE-NO-RA."

  mnemonics: [

    ["DAC", "Atributos do poder de polícia: Discricionariedade, Autoexecutoriedade, Coercibilidade."],
    ["O Cachorro Fica Sentado", "Ciclo de polícia: Ordem, Consentimento, Fiscalização, Sanção."],
    ["EXcesso = EXtrapola; DEsvio = DEstino errado", "Excesso fere a competência; desvio fere a finalidade."]
  ],
  flash: [
    ["O que não pode ser delegado segundo a Lei 9.784?", "Atos normativos, decisão de recursos administrativos e matérias de competência exclusiva."],
    ["Quais as características da avocação?", "Temporária, excepcional, motivada, de competência de órgão inferior."],
    ["Quais os atributos do poder de polícia?", "Discricionariedade, autoexecutoriedade e coercibilidade."],
    ["Quais fases do ciclo de polícia podem ser delegadas a estatal de direito privado (Tema 532)?", "Consentimento, fiscalização e sanção. A ordem, não."],
    ["O que o decreto autônomo pode fazer?", "Organizar a administração federal sem aumentar despesa nem criar/extinguir órgãos; extinguir cargos ou funções vagos."],

  ],
  quiz: [
    { id: "m4q1", q: "Um agente tem competência para praticar determinado ato, mas o utiliza para perseguir um desafeto, finalidade estranha ao interesse público previsto em lei. A situação caracteriza:",
      o: ["regular exercício do poder hierárquico.", "excesso de poder.", "desvio de finalidade.", "delegação de competência.", "avocação."], a: 2,
      e: "Competência existia; o fim é que estava errado. Excesso seria atuar além da competência." },
    { id: "m4q2", q: "De acordo com a Lei 9.784/1999, NÃO podem ser objeto de delegação:",
      o: ["os atos de mero expediente e rotina.", "a edição de atos de caráter normativo, a decisão de recursos administrativos e as matérias de competência exclusiva.", "a assinatura de ofícios e memorandos.", "os atos de instrução do processo.", "quaisquer atos, pois a delegação foi vedada pela lei."], a: 1,

    { id: "m4q3", q: "A vigilância sanitária interdita um restaurante com alimentos estragados, sem prévia autorização judicial. Esse agir direto se apoia no atributo da:",
      o: ["autoexecutoriedade.", "hierarquia.", "tipicidade penal.", "supremacia do poder disciplinar.", "delegabilidade do poder regulamentar."], a: 0,
      e: "Autoexecutoriedade: a Administração executa diretamente suas decisões de polícia, sem precisar do Judiciário, quando a lei autoriza ou há urgência." },
    { id: "m4q4", q: "Segundo o STF (Tema 532), é constitucional a delegação, por lei, do poder de polícia a pessoa jurídica de direito privado da Administração indireta, de capital majoritariamente público, prestadora exclusiva de serviço público próprio do Estado em regime não concorrencial, nas fases de:",
      o: ["ordem, consentimento e fiscalização.", "consentimento, fiscalização e sanção.", "ordem, apenas.", "todas as fases do ciclo de polícia.", "nenhuma fase, pois o poder de polícia é indelegável."], a: 1,
      e: "A ordem de polícia (legislar) é indelegável. Consentimento, fiscalização e sanção podem ser delegados nas condições fixadas pelo STF." },
    { id: "m4q5", q: "Com base no art. 84, VI, da Constituição, o Presidente da República pode, mediante decreto:",
      o: ["criar um novo órgão público.", "extinguir cargo público vago.", "extinguir cargo público ocupado por servidor estável.", "reorganizar a administração com aumento de despesa.", "instituir tributo para custear serviço público."], a: 1,
      e: "Decreto autônomo: extinção de cargos ou funções vagos e organização da administração sem aumento de despesa e sem criar ou extinguir órgãos." },
    { id: "m4q6", q: "Uma universidade federal aplica advertência a empresa terceirizada que descumpriu o contrato. No mesmo dia, a prefeitura multa um bar por som acima do permitido. Os poderes exercidos são, respectivamente:",
      o: ["disciplinar e de polícia.", "de polícia e disciplinar.", "hierárquico e regulamentar.", "regulamentar e disciplinar.", "hierárquico e de polícia."], a: 0,
      e: "A contratada tem vínculo especial com a Administração: poder disciplinar. O bar é particular sem vínculo: poder de polícia." },
    { id: "m4q7", q: "A licença para construir, concedida pelo município após o proprietário atender a todos os requisitos legais, é classificada como ato:",
      o: ["discricionário e precário.", "vinculado: preenchidos os requisitos, a Administração deve concedê-la.", "revogável a qualquer tempo por conveniência.", "decorrente do poder disciplinar.", "delegável a qualquer particular, sem lei."], a: 1,

MISSIONS.push({
  id: "m5", n: 5, color: "var(--c5)", min: 30,
  title: "Serviços públicos",
  edital: "Item 5: conceito, classificação, regulamentação e controle; forma, meios e requisitos; delegação (concessão, permissão e autorização).",

  summary: [

    ["Serviço adequado", "Regularidade, continuidade, eficiência, segurança, atualidade, generalidade, cortesia e modicidade das tarifas."],
    ["Concessão × permissão", "Concessão: contrato, PJ ou consórcio, prazo determinado. Permissão: contrato de adesão, precária, <b>PF ou PJ</b>."],
    ["Fim da concessão", "Encampação = interesse público. <mark>Caducidade = culpa da concessionária</mark>."]
  ],
  sections: [
    { t: "Conceito e elementos", h: `
      <p>Serviço público é toda atividade material que a lei atribui ao Estado para que a exerça diretamente ou por meio de delegados, com o objetivo de satisfazer necessidades coletivas, sob regime jurídico total ou parcialmente público (conceito de Di Pietro).</p>
      <div class="card-grid">
        <div class="mini"><b>Subjetivo</b><p>O Estado é o titular, ainda que outro execute.</p></div>
        <div class="mini"><b>Material</b><p>Atende necessidades coletivas.</p></div>
        <div class="mini"><b>Formal</b><p>Submete-se a regime de direito público.</p></div>
      </div>
      <aside class="law"><b>CF, art. 175:</b> incumbe ao Poder Público, na forma da lei, diretamente ou sob regime de concessão ou permissão, sempre através de licitação, a prestação de serviços públicos.</aside>` },
    { t: "Classificações", h: `
      ${tbl(["Critério","Tipos","Exemplo"],[

        ["Essencialidade (Hely)","Próprios (só o Estado presta) × impróprios (podem ser delegados)","Defesa nacional × transporte coletivo"],
        ["Objeto","Administrativos, comerciais/industriais e sociais","Imprensa oficial; energia; educação e saúde"],
        ["Exclusividade","Exclusivos do Estado × não exclusivos","Serviço postal × educação (particulares também prestam)"]
      ])}
      <p>Uti universi costuma ser custeado por impostos; uti singuli, por taxa ou tarifa.</p>` },
    { t: "Formas, meios e requisitos", h: `
      <p><b>Forma de prestação:</b> centralizada (pelo próprio ente), descentralizada (outorga à indireta ou delegação a particulares) e desconcentrada (distribuída entre órgãos). <b>Execução</b> pode ser direta (pelos próprios meios) ou indireta (contratando terceiros).</p>
      <p><b>Requisitos do serviço adequado</b> (Lei 8.987/1995, art. 6º, §1º). Pense num ônibus bom:</p>
      ${tbl(["Requisito","No ônibus"],[
        ["Regularidade","Passa no horário"],["Continuidade","Não para de circular"],["Eficiência","Chega bem e rápido"],["Segurança","Não expõe o passageiro a risco"],
        ["Atualidade","Frota e técnicas modernas"],["Generalidade","Atende todos, sem discriminação"],["Cortesia","Motorista e cobrador educados"],["Modicidade das tarifas","Passagem justa"]
      ])}
      <aside class="law"><b>Lei 8.987/1995, art. 6º, §3º e §4º:</b> não caracteriza descontinuidade a interrupção em situação de emergência ou após prévio aviso, motivada por razões de ordem técnica ou de segurança, ou por inadimplemento do usuário, considerado o interesse da coletividade. A interrupção por inadimplemento <b>não pode começar na sexta, no sábado, no domingo, em feriado ou no dia anterior a feriado</b>.</aside>` },
    { t: "Delegação: concessão, permissão e autorização", h: `
      ${tbl(["","Concessão","Permissão","Autorização"],[
        ["Natureza","Contrato administrativo","Contrato de adesão (art. 40)","Ato unilateral, discricionário e precário"],
        ["Licitação","Sim: <b>concorrência ou diálogo competitivo</b>","Sim (qualquer modalidade cabível)","Em regra, não"],
        ["Quem recebe","PJ ou consórcio de empresas","Pessoa física ou jurídica","Particular"],
        ["Prazo","Determinado","Precária, revogável unilateralmente","Precária"]
      ])}
      <p><b>PPP</b> (Lei 11.079/2004) é uma concessão especial: <i>patrocinada</i> (tarifa + contraprestação pública) ou <i>administrativa</i> (a Administração é a usuária). Valor mínimo de R$ 10 milhões e prazo de 5 a 35 anos.</p>` },
    { t: "Regulamentação, controle e extinção", h: `
      <p>O poder concedente <b>regulamenta e fiscaliza</b> permanentemente o serviço (muitas vezes por agências reguladoras), pode alterar cláusulas regulamentares e até <b>intervir</b> na concessão (art. 32 da Lei 8.987). O usuário tem direitos garantidos também pela Lei 13.460/2017, que criou a Carta de Serviços ao Usuário.</p>
      ${tbl(["Forma de extinção","Motivo","Detalhe cobrado"],[
        ["Advento do termo","Fim do prazo","Forma normal"],
        ["Encampação","Interesse público","Exige <b>lei autorizativa específica</b> e <b>prévio pagamento</b> da indenização"],
        ["Caducidade","Inexecução pela concessionária","Precedida de processo administrativo; declarada por decreto"],
        ["Rescisão","Descumprimento pelo poder concedente","Iniciativa da concessionária, por <b>ação judicial</b>; o serviço não pode parar até o trânsito em julgado"],
        ["Anulação","Ilegalidade","Efeitos retroativos"],
        ["Falência ou extinção da empresa","Fato da concessionária","Também falecimento/incapacidade do titular de empresa individual"]
      ])}
      <p>Ao fim da concessão ocorre a <b>reversão</b> dos bens vinculados ao serviço ao poder concedente.</p>` }
  ],
  traps: [
    "“Continuidade proíbe qualquer interrupção.” <b>Errado.</b> Admite interrupção por emergência, razões técnicas/segurança e inadimplemento com aviso prévio.",

  quiz: [

      e: "Art. 2º, II, com a redação dada pela Lei 14.133/2021, que incluiu o diálogo competitivo." },
    { id: "m5q3", q: "Durante o prazo contratual, o poder concedente retoma o serviço por motivo de interesse público, mediante lei autorizativa específica e após prévio pagamento de indenização. Trata-se de:",

      e: "Art. 6º, §§3º e 4º, da Lei 8.987 (o §4º veio da Lei 14.015/2020)." },
    { id: "m5q5", q: "Iluminação pública e segurança pública são exemplos de serviços:",

function daysLeft(){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((EXAM_DATE - t) / 864e5); }
function seen(mid, step){ S.steps[mid] = S.steps[mid] || []; if (!S.steps[mid].includes(step)){ S.steps[mid].push(step); touch(); } }

/* ---------- cronômetro de estudo ativo ---------- */
let lastInput = Date.now(), idle = false;
["pointerdown","keydown","scroll","touchstart","wheel","pointermove"].forEach(ev =>
  window.addEventListener(ev, () => { lastInput = Date.now(); if (idle){ idle = false; paintTop(); } }, { passive: true }));
setInterval(() => {
  if (!S.started || S.finishedAt) return;
  if (S.paused){ S.pausedSec++; touch(); paintPause(); return; }
  if (document.visibilityState !== "visible") return;
  if (S.prefs.idle && (Date.now() - lastInput) / 1000 > IDLE_LIMIT){ if (!idle){ idle = true; paintTop(); } return; }
  S.active++;
  const cur = (V.name === "mission") ? V.mid : null;
  if (cur){ S.msec[cur] = (S.msec[cur] || 0) + 1; S.ssec[cur] = S.ssec[cur] || {}; S.ssec[cur][V.step] = (S.ssec[cur][V.step] || 0) + 1; }
  touch(); paintTop();
}, 1000);

  const tp = $("#timePill");

  tp.classList.toggle("paused", idle || !S.started);

  tp.title = idle ? "Cronômetro pausado por inatividade. Mexa o mouse ou toque na tela para retomar." : "Tempo ativo de estudo";
}

/* ---------- pomodoro ---------- */
let P = { mode: "off", end: 0 };
function beep(){ if (!S.prefs.sound) return; try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain();
  o.type = "sine"; o.frequency.value = 660; g.gain.setValueAtTime(.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(.15, a.currentTime + .05); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .9);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 1); } catch (e) {} }
function pomoStart(mode){ const min = mode === "focus" ? S.prefs.pomo : 5; P = { mode, end: Date.now() + min * 60000 }; paintPomo(); }
function paintPomo(){
  const b = $("#pomoBtn"), l = $("#pomoLbl");
  b.classList.toggle("run", P.mode === "focus"); b.classList.toggle("brk", P.mode === "break");
  if (P.mode === "off"){ l.textContent = S.prefs.pomo + " min"; b.title = "Iniciar bloco de foco de " + S.prefs.pomo + " minutos"; return; }
  const left = Math.max(0, (P.end - Date.now()) / 1000);
  l.textContent = (P.mode === "break" ? "Pausa " : "") + clock(left);
  b.title = "Clique para encerrar o bloco";
}
setInterval(() => {
  if (P.mode === "off") return;
  if (S.paused){ P.end += 1000; return; }
  if (Date.now() >= P.end){
    const was = P.mode; P = { mode: "off", end: 0 }; paintPomo(); beep();
    if (was === "focus") toast("Bloco de foco concluído. Levante, beba água, olhe para longe.", [["Pausa de 5 min", () => pomoStart("break")], ["Seguir estudando", () => {}]], 0, true);
    else toast("Pausa encerrada. Retome de onde parou.", [["Novo bloco", () => pomoStart("focus")]], 12000, true);
  } else paintPomo();
}, 1000);

/* ---------- toasts ---------- */
function toast(msg, actions = [], ms = 5000, keep = false){
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<span>${msg}</span>`; if (keep) t.dataset.keep = "1";
  if (actions.length){ const r = document.createElement("div"); r.className = "row";
    actions.forEach(([lab, fn]) => { const b = document.createElement("button"); b.textContent = lab; b.onclick = () => { t.remove(); fn(); }; r.appendChild(b); }); t.appendChild(r); }
  $("#toasts").appendChild(t); if (ms) setTimeout(() => t.remove(), ms);
}
function floaty(el, txt){ if (S.prefs.motion === "off") return; const r = el.getBoundingClientRect(); const f = document.createElement("div");
  f.className = "floaty"; f.textContent = txt; f.style.left = (r.right - 60) + "px"; f.style.top = (r.top) + "px"; document.body.appendChild(f); setTimeout(() => f.remove(), 950); }

/* ---------- pausa ---------- */
function setPause(on){
  if (!S.started || S.finishedAt) return;
  S.paused = on; if (on){ S.pauses++; pauseStartAt = Date.now(); } else { lastInput = Date.now(); idle = false; }
  touch(); save(); paintPause(); paintTop();

}
function paintPause(){

let pauseStartAt = null;
function pauseRun(){ if (!S.paused){ pauseStartAt = null; return 0; } if (!pauseStartAt) pauseStartAt = Date.now(); return (Date.now() - pauseStartAt) / 1000; }

/* ---------- análise de tempos ---------- */
const SHORT = { m1: "Estado e Governo", m2: "Organização", m3: "Agentes", m4: "Poderes", m5: "Serviços", m6: "Controle e resp.", m7: "Licitações", sim: "Simulado" };
const WPM = 110, FLASH_S = 25, Q_S = 120;   // leitura atenta de texto jurídico ≈ 110 palavras/min
const words = h => String(h).replace(/<[^>]+>/g, " ").split(/\s+/).filter(Boolean).length;
function readWords(m){ if (!m.sections) return 0;
  return words(m.summary.map(x => x.join(" ")).join(" ")) + words(m.sections.map(x => x.t + " " + x.h).join(" ")) + words(m.traps.join(" ") + " " + m.mnemonics.map(x => x.join(" ")).join(" ")); }
function stepTimes(m){ const t = S.ssec[m.id] || {};
  return { leitura: (t.resumo || 0) + (t.entenda || 0) + (t.pegadinhas || 0), flash: t.flash || 0, quiz: t.quiz || 0 }; }
function expected(m){ return { leitura: m.sections ? readWords(m) / WPM * 60 : 0, flash: m.flash ? m.flash.length * FLASH_S : 0, quiz: m.quiz.length * Q_S }; }
function band(act, exp){
  if (!exp) return { k: "na", t: "—" };
  if (act < 5) return { k: "red", t: "não feito" };
  const r = act / exp;
  if (r < .35) return { k: "red", t: "muito rápido" };
  if (r < .55) return { k: "yellow", t: "rápido" };
  if (r <= 2) return { k: "green", t: "ok" };
  if (r <= 3) return { k: "yellow", t: "demorou" };
  return { k: "red", t: "muito lento" };
}
const mins = s => s < 60 ? Math.round(s) + "s" : "~" + Math.round(s / 60) + " min";
function analysis(){
  let w = 0, ls = 0, qn = 0, qs = 0, flags = [];
  ALL.forEach(m => { const t = stepTimes(m), e = expected(m);
    if (m.sections && t.leitura > 5){ w += readWords(m); ls += t.leitura; }
    qn += mStats(m).a; qs += t.quiz;
    [["leitura","leitura"],["flash","flashcards"],["quiz","questões"]].forEach(([k,l]) => { const b = band(t[k], e[k]);
      if (b.k === "red") flags.push(`${SHORT[m.id]}: ${l} ${b.t} (${clock(t[k])}; esperado ${mins(e[k])})`); }); });
  const wpm = ls ? Math.round(w / (ls / 60)) : 0;
  let rd;
  if (!wpm) rd = ["red", "Sem tempo de leitura registrado."];
  else if (wpm > 300) rd = ["red", `Leitura muito rápida (${wpm} palavras/min): provável leitura por cima, pulando blocos.`];
  else if (wpm > 200) rd = ["yellow", `Leitura rápida (${wpm} palavras/min): pode ter passado por cima de partes.`];
  else if (wpm >= 55) rd = ["green", `Leitura em ritmo de estudo (${wpm} palavras/min).`];
  else rd = ["yellow", `Leitura lenta (${wpm} palavras/min): pode indicar distração ou dificuldade.`];
  const per = qn ? qs / qn : 0;
  let qd;
  if (!qn) qd = ["red", "Nenhuma questão respondida."];
  else if (per < 30) qd = ["red", `Média de ${clock(per)} por questão: rápido demais, sinal de chute.`];
  else if (per < 60) qd = ["yellow", `Média de ${clock(per)} por questão: rápido; vale ler os comentários com calma.`];
  else if (per <= 240) qd = ["green", `Média de ${clock(per)} por questão: bom ritmo (na prova, cerca de 3 min por questão).`];
  else qd = ["yellow", `Média de ${clock(per)} por questão: lento para o ritmo da prova.`];
  const readBlocks = Object.values(S.read).reduce((a, r) => a + r.length, 0), totBlocks = MISSIONS.reduce((a, m) => a + m.sections.length, 0);
  return { rd, qd, flags, readBlocks, totBlocks };
}
function vReport(){
  const t = totals(), pts = t.c * PTS, max = t.t * PTS, pct = Math.round(t.c / t.t * 100);
  const lvl = pct >= 85 ? ["green","Excelente"] : pct >= 70 ? ["green","Competitivo"] : pct >= 50 ? ["yellow","Passa do mínimo, precisa melhorar"] : ["red","Abaixo do mínimo da prova (50%)"];
  const A = analysis(), now = new Date(S.finishedAt || Date.now());
  const cell = (m, k) => { const tt = stepTimes(m)[k], e = expected(m)[k]; const b = band(tt, e);
    if (b.k === "na") return `<td class="na">—</td>`;
    return `<td class="${b.k}"><b>${clock(tt)}</b><small>${b.t}</small></td>`; };
  const rows = ALL.map(m => { const s = mStats(m), p = s.t ? s.c / s.t : 0;
    const k = !s.a ? "red" : p >= .7 ? "green" : p >= .5 ? "yellow" : "red";
    return `<tr><th scope="row">${SHORT[m.id]}</th>${cell(m,"leitura")}${cell(m,"flash")}${cell(m,"quiz")}<td class="${k}"><b>${s.c}/${s.t}</b></td></tr>`; }).join("");
  return `<section class="report" id="report">
    <div class="rp-head"><div><span class="rp-k">Relatório de estudo</span><b class="rp-name">${esc(S.name || "Estudante")}</b>
      <span class="rp-sub">Direito Administrativo · UFBA 2026 · ${now.toLocaleDateString("pt-BR")} ${now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</span></div>
      <div class="rp-score ${lvl[0]}"><b>${pts}</b><span>de ${max} pts</span></div></div>
    <div class="rp-verdict ${lvl[0]}">${pct}% de acertos (${t.c}/${t.t}) · ${lvl[1]}</div>
    <div class="rp-stats"><div><b>${clock(S.active)}</b><span>estudando</span></div><div><b>${S.pauses}</b><span>pausas (${clock(S.pausedSec)})</span></div><div class="${S.leaves > 3 ? "red" : S.leaves ? "yellow" : ""}"><b>${S.leaves}</b><span>saídas da aba</span></div></div>
    <div class="rp-tbl"><table><thead><tr><th>Etapa</th><th>Leitura</th><th>Cartões</th><th>Questões</th><th>Acertos</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="rp-legend"><span><i class="green"></i>ok, no esperado</span><span><i class="yellow"></i>atenção</span><span><i class="red"></i>rápido ou lento demais</span></div>
    <ul class="rp-an"><li class="${A.rd[0]}">${A.rd[1]} Blocos marcados como lidos: ${A.readBlocks}/${A.totBlocks}.</li><li class="${A.qd[0]}">${A.qd[1]}</li>
      ${A.flags.slice(0, 2).map(f => `<li class="red">${f}</li>`).join("")}${A.flags.length > 2 ? `<li class="red">+${A.flags.length - 2} outros pontos em vermelho na tabela.</li>` : ""}</ul>
    <p class="rp-foot">📸 Tire um print desta tela e envie para o seu pai.</p>
    <p class="rp-note">Esperado: leitura ~110 palavras/min · cartões ~25 s cada · questões ~2 min cada.</p>
  </section>
  <div class="row" style="justify-content:center;margin:12px 0 18px"><button class="btn primary" id="copyRep">Copiar relatório em texto</button></div>
  ${professorFinalQr()}`;
}
function reportText(){
  const t = totals(), A = analysis();
  const lines = ALL.map(m => { const tt = stepTimes(m), e = expected(m), s = mStats(m);
    const part = (k, l) => e[k] ? ` ${l} ${clock(tt[k])} (${band(tt[k], e[k]).t})` : "";
    return `• ${SHORT[m.id]}:${part("leitura","leitura")}${part("flash","cartões")}${part("quiz","questões")} — ${s.c}/${s.t}`; });
  return `Relatório de ${S.name} — Direito Administrativo UFBA 2026\nPontuação: ${t.c * PTS}/${t.t * PTS} (${Math.round(t.c / t.t * 100)}%)\nTempo estudando: ${clock(S.active)} · Pausas: ${S.pauses} (${clock(S.pausedSec)}) · Saídas da aba: ${S.leaves}\n${lines.join("\n")}\n${A.rd[1]}\n${A.qd[1]}`;
}

function nextStepFor(m){
  if (m.id === "sim") return "quiz";
  const s = S.steps[m.id] || [];

  return firstUnseen ? firstUnseen[0] : "quiz";

function nextTarget(){
  const m = ALL.find(x => !S.done[x.id] && (x.id !== "sim" || MISSIONS.every(mm => S.done[mm.id])))

    ${m.twoInOne ? `<span class="tag two">2 em 1 · ${m.twoInOne}</span>` : ""}
    <nav class="steps" aria-label="Etapas da missão">${steps.map(([k,l],i) => `<button data-step="${k}" class="${seenS.includes(k) ? "seen" : ""}" ${V.step === k ? 'aria-current="step"' : ""}><span class="n">${seenS.includes(k) ? "✓" : i+1}</span>${l}</button>`).join("")}</nav>
  </section>`;
  let body = "";
  if (V.step === "resumo") body = stResumo(m);
  else if (V.step === "entenda") body = stEntenda(m);
  else if (V.step === "pegadinhas") body = stTraps(m);
  else if (V.step === "flash") body = stFlash(m);
  else body = stQuiz(m);
  return head + `<section class="panel" style="--mc:${m.color}">${body}</section>`;
}
function nextBtn(m, cur){
  const i = STEPS.findIndex(([k]) => k === cur); const n = STEPS[i+1];
  return n ? `<div class="next-row"><span class="muted">Próxima etapa: ${n[1]}</span><button class="btn primary" data-step="${n[0]}">Ir para ${n[1].toLowerCase()}</button></div>` : "";
}
function stResumo(m){
  return `<h2>Em 30 segundos</h2><p class="muted">Leia os quatro cartões. Depois tente repetir em voz alta, sem olhar.</p>
    <div class="sum-grid">${m.summary.map(([k,v]) => `<div class="sum"><span class="k">${k}</span><p>${v}</p></div>`).join("")}</div>${nextBtn(m,"resumo")}`;
}
function stEntenda(m){
  const r = S.read[m.id] || [];
  const tot = m.sections.length;
  return `<h2>Entenda, um bloco de cada vez</h2><p class="muted">${r.length} de ${tot} blocos lidos. Abra um, leia e marque “Entendi” para seguir ao próximo.</p>
  ${m.sections.map((s,i) => {
    const open = V.openSec === i;
    return `<div class="acc ${open ? "open" : ""} ${r.includes(i) ? "read" : ""}">
      <button data-acc="${i}" aria-expanded="${open}"><span class="chk" aria-hidden="true">${r.includes(i) ? "✓" : i+1}</span>${s.t}<span class="mins">~${Math.max(2, Math.round(s.h.replace(/<[^>]+>/g,"").split(/\s+/).length / 150))} min</span></button>
      ${open ? `<div class="acc-body">${s.h}<div class="row end"><button class="btn primary" data-read="${i}">${i < tot-1 ? "Entendi, próximo bloco" : "Entendi, terminei"}</button></div></div>` : ""}
    </div>`; }).join("")}

}
function stTraps(m){
  return `<h2>Pegadinhas que a banca adora</h2><p class="muted">Cada frase abaixo parece certa e está errada. Leia a correção em negrito.</p>
    <ul class="trap-list">${m.traps.map(t => `<li>${t}</li>`).join("")}</ul>
    <h2>Macetes</h2><div class="mn">${m.mnemonics.map(([a,b]) => `<div><b>${a}</b>${b}</div>`).join("")}</div>${nextBtn(m,"pegadinhas")}`;
}
function deckOrder(m){ // cartões ainda não sabidos primeiro
  return m.flash.map((c,i) => i).sort((a,b) => ((S.flash[m.id+":"+a] === "sei") - (S.flash[m.id+":"+b] === "sei")));
}
function stFlash(m){
  if (!V.deck || V.deckMid !== m.id){ V.deck = deckOrder(m); V.deckMid = m.id; V.fi = 0; }
  const order = V.deck; if (V.fi >= order.length) V.fi = 0;
  const idx = order[V.fi], c = m.flash[idx];
  const known = m.flash.filter((_,i) => S.flash[m.id+":"+i] === "sei").length;
  return `<h2>Flashcards</h2><p class="muted">Tente responder de cabeça antes de virar. Recuperar da memória fixa mais do que reler.</p>
    <div class="fc-meta"><span>Cartão ${V.fi+1} de ${order.length}</span><span>${known} de ${m.flash.length} já sabidos</span></div>
    <div class="flash-wrap"><button class="flash ${V.flipped ? "flipped" : ""}" id="card" aria-label="${V.flipped ? "Resposta: " + esc(c[1]) : "Pergunta: " + esc(c[0]) + ". Clique para ver a resposta."}">
      <span class="face front">${c[0]}<small>Toque ou Espaço para virar</small></span>

      <button class="btn ghost" data-fc="rever" ${V.flipped ? "" : "disabled"}>Ainda não (2)</button>

function stQuiz(m){
  const qs = m.quiz;
  const dots = `<div class="qdots" aria-label="Questões">${qs.map((q,i) => { const r = S.ans[q.id];
    return `<button data-qi="${i}" class="${r ? (r.c ? "ok" : "no") : ""} ${V.qi === i ? "now" : ""}" aria-label="Questão ${i+1}${r ? (r.c ? ", acertou" : ", errou") : ""}">${i+1}</button>`; }).join("")}</div>`;
  if (V.qi >= qs.length) return dots + quizSummary(m);
  const q = qs[V.qi], r = S.ans[q.id];
  const opts = q.o.map((o,i) => {
    let cls = ""; if (r){ if (i === q.a) cls = "right"; else if (i === r.pick) cls = "wrong"; else cls = "dim"; }
    return `<button class="opt ${cls}" data-opt="${i}" ${r ? "disabled" : ""}><span class="L">${LETTERS[i]}</span><span>${o}</span></button>`; }).join("");
  const fb = r ? `<div class="fb ${r.c ? "ok" : "no"}" role="status"><b>${r.c ? "Certo! +" + PTS + " pontos." : "Resposta correta: " + LETTERS[q.a] + "."}</b>${q.e}</div>
    <div class="next-row"><span class="muted">${V.qi+1} de ${qs.length}</span><button class="btn primary" id="qNext">${V.qi < qs.length-1 ? "Próxima questão" : "Ver fechamento"}</button></div>` : "";
  return dots + `<p class="muted" style="margin-bottom:6px">Questão ${V.qi+1} de ${qs.length} · vale ${PTS} pontos</p>
    <p class="qtext">${q.q}</p><div class="opts" role="group" aria-label="Alternativas">${opts}</div>${fb}
    ${r ? "" : `<p class="kbd-hint">Responda com <kbd>A</kbd>–<kbd>E</kbd> ou <kbd>1</kbd>–<kbd>5</kbd>.</p>`}`;
}
function quizSummary(m){
  const s = mStats(m), all = s.a === s.t, pct = s.t ? Math.round(s.c / s.t * 100) : 0, isSim = m.id === "sim";
  if (!all) return `<h2>Faltam ${s.t - s.a} questões</h2><p>Use os números acima para voltar às questões em aberto.</p>`;

  return `<h2>${isSim ? "Simulado concluído" : "Fechamento da missão " + m.n}</h2>

      <div class="stat"><b>${s.c * PTS}</b><span>pontos de ${s.t * PTS}</span></div>
      <div class="stat"><b>${clock(S.msec[m.id] || 0)}</b><span>tempo nesta ${isSim ? "etapa" : "missão"}</span></div>
    </div>
    ${isSim ? "" : `<p><b>Quão seguro você se sente neste assunto?</b> Sua resposta ajuda a decidir o que revisar primeiro.</p>
    <div class="conf" role="group" aria-label="Confiança">${[["baixa","Preciso rever"],["media","Quase lá"],["alta","Domino"]].map(([k,l]) => `<button data-conf="${k}" aria-pressed="${conf === k}">${l}</button>`).join("")}</div>`}
    ${professorMissionQr(m)}
    <div class="next-row">${s.c < s.t ? `<button class="btn ghost" data-go="errors">Revisar erros</button>` : "<span></span>"}
      ${isSim || !nextM ? `<button class="btn primary" data-go="result">Ver relatório final</button>`
        : `<button class="btn primary" id="toNext" ${conf ? "" : "disabled"}>${conf ? "Ir para a " + (nextM.id === "sim" ? "etapa final: simulado" : "missão " + nextM.n) : "Escolha sua confiança acima"}</button>`}</div>`;
}

/* ---------- caderno de erros ---------- */

      return `<button class="opt ${cls}" data-popt="${i}" ${pk != null ? "disabled" : ""}><span class="L">${LETTERS[i]}</span><span>${o}</span></button>`; }).join("");

      <p class="qtext">${q.q}</p><div class="opts">${opts}</div>
      ${pk != null ? `<div class="fb ${pk === q.a ? "ok" : "no"}"><b>${pk === q.a ? "Recuperou!" : "Resposta correta: " + LETTERS[q.a] + "."}</b>${q.e}</div>

          <p style="margin:.6em 0 .3em"><b>${q.q}</b></p><p class="muted" style="margin:0">Correta: ${LETTERS[q.a]}) ${q.o[q.a]}</p></div></div>`; }).join("")}`
      : `<p>Nenhum erro registrado. Responda questões nas missões para alimentar o caderno.</p>`}
  </section>`;
}

/* ---------- mapa do edital ---------- */

/* ---------- resultado ---------- */
function vResult(){
  const t = totals(), max = t.t * PTS, pts = t.c * PTS;
  const pctAll = Math.round(t.c / t.t * 100), pctAns = t.a ? Math.round(t.c / t.a * 100) : 0;
  const finished = !!S.finishedAt;
  const wall = S.started ? ((S.finishedAt || Date.now()) - S.started) / 1000 : 0;
  const ref = finished ? pctAll : pctAns;
  let verdict;
  if (!t.a) verdict = ["Ainda sem questões respondidas.", "Comece pela missão 1 para ver seu desempenho aqui."];
  else if (ref < 50) verdict = ["Zona de risco.", "Abaixo de 50% é a linha de eliminação da objetiva. Revise o caderno de erros e refaça as missões mais fracas."];
  else if (ref < 70) verdict = ["Passaria do corte mínimo, mas ainda não é competitivo.", "Com 94 vagas e muita concorrência, mire acima de 70% nos treinos. Foque nas missões com barra mais curta."];
  else if (ref < 85) verdict = ["Competitivo.", "Bom nível. Refaça os erros daqui a 3 dias e daqui a 1 semana para consolidar."];
  else verdict = ["Excelente.", "Domínio forte. Mantenha com revisões curtas e avance para os próximos blocos do edital."];
  const proj = Math.round(ref / 100 * 60);
  const rows = ALL.map(m => { const s = mStats(m), p = s.t ? Math.round(s.c / s.t * 100) : 0;
    return `<div class="bar-row"><span>${m.id === "sim" ? "Simulado" : m.n + ". " + esc(m.title)}</span><div class="bar"><i style="width:${s.a ? p : 0}%;background:${m.color}"></i></div>
      <span class="muted" style="font-variant-numeric:tabular-nums">${s.a ? s.c + "/" + s.t : "—"} · ${clock(S.msec[m.id] || 0)}</span></div>`; }).join("");
  return vReport() + `<h2 style="margin:8px 0 12px">Detalhes</h2><section class="panel">
    <p class="m-kicker" style="--mc:var(--reward)">${finished ? "Módulo concluído em " + new Date(S.finishedAt).toLocaleDateString("pt-BR") : "Resultado parcial"}</p>
    <div class="score-big"><b>${pts}</b><span>de ${max} pontos</span></div>
    <p class="muted">${t.c} acertos em ${t.t} questões (${pctAll}% do total${finished ? "" : ` · ${pctAns}% das ${t.a} respondidas`}). Cada acerto vale 2 pontos, como nos Conhecimentos Específicos.</p>
    <div class="gauge" role="img" aria-label="Aproveitamento de ${ref}%. Linha de eliminação em 50%, meta de treino em 70%.">
      <div class="fill" style="width:${ref}%"></div>
      <div class="mk" style="left:50%"><span>50% eliminação</span></div><div class="mk" style="left:70%"><span>70% meta</span></div>
    </div>
    <div class="stat-row">
      <div class="stat"><b>${clock(S.active)}</b><span>tempo ativo de estudo</span></div>
      <div class="stat"><b>${S.started ? fmtDur(wall) : "—"}</b><span>do início ${finished ? "à conclusão" : "até agora"}</span></div>
      <div class="stat"><b>${S.best}</b><span>maior sequência de acertos</span></div>
      <div class="stat"><b>~${proj}/60</b><span>projeção nos Específicos com esse ritmo</span></div>
    </div>
    <div class="verdict"><b>${verdict[0]}</b> ${verdict[1]}</div>
  </section>
  <section class="panel"><h2>Por missão</h2><p class="muted">Acertos e tempo gasto. A barra mais curta é a próxima revisão.</p><div class="bars">${rows}</div></section>
  <section class="panel"><h2>Próximos passos</h2>
    <div class="row"><button class="btn primary" data-go="errors">Refazer o que errei (${wrongIds().length})</button>
    <button class="btn ghost" id="copyRes">Copiar resumo</button>
    <button class="btn ghost" id="resetAll">Recomeçar do zero</button></div>
    <p class="hint" style="margin-top:14px">O tempo ativo pausa quando a aba fica oculta ou quando você passa 4 minutos sem interagir; o outro tempo conta o calendário, do primeiro clique até a última questão.</p>
  </section>`;
}
function fmtDur(s){ const d = Math.floor(s/86400); return d >= 1 ? d + (d === 1 ? " dia " : " dias ") + Math.floor(s%86400/3600) + "h" : clock(s); }

/* ---------- ajustes ---------- */
function openSettings(){
  const p = S.prefs;
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v,l]) => `<button data-pref="${key}" data-val="${v}" aria-pressed="${String(p[key]) === String(v)}">${l}</button>`).join("")}</div>`;
  const tog = (key, on) => `<button class="toggle" data-tog="${key}" aria-pressed="${on}" aria-label="Alternar"></button>`;
  $("#sheet").innerHTML = `<div class="panel"><div class="row"><h2 id="setTitle" style="margin:0">Ajustes de leitura</h2><span class="spacer"></span><button class="icon-btn" id="closeSet" aria-label="Fechar">✕</button></div>

    <div class="set"><span>Fonte<small>Lexend e Atkinson foram desenhadas para leitura fácil</small></span>${seg("font",[["lexend","Lexend"],["atkinson","Atkinson"],["system","Sistema"]])}</div>
